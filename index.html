<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link href="https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Osu%21_Logo_2016.svg/langfr-250px-Osu%21_Logo_2016.svg.png?utm_source=fr.wikipedia.org&amp;utm_campaign=parser&amp;utm_content=thumbnail" rel="icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Architect-e/osu.html@main/style.css">
    <title>OSU! HTML VERSION</title>
</head>
<body>
    <div class="bg"></div>
    <div class="container">
        <div class="top-bar"></div>
        <div class="center-stage">
            <div class="menu-bar" id="menu-bar">
                <button class="menu-btn settings">
                    ⚙
                    <span>settings</span>
                </button>

        <img
            id="osu-menu-logo"
            src="https://upload.wikimedia.org/wikipedia/commons/2/29/Osu%21_logo_2024.png"
            alt="osu! logo"
            onclick="toggleMenu()"
        >

        <button class="menu-btn play">
            ◎
            <span>play</span>
        </button>

        <button class="menu-btn edit">
            ◉
            <span>edit</span>
        </button>

        <button class="menu-btn browse">
            ♫
            <span>browse</span>
        </button>

        <button class="menu-btn exit" onclick="window.location.href='https://google.com'">
            ✕
            <span>exit</span>
        </button>

    </div>

</div>

    </div>

    <script src="https://cdn.jsdelivr.net/gh/Architect-e/osu.html@main/main.js"></script>
</body>
</html>
